<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6b164b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="زمر النور"><meta name="application-name" content="حلقات زمر النور">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<title>حلقات زمر النور</title>
<style>
/* Layout: maroon logo band on top with mode switch, icon tabs below (bottom bar on phones), working canvas; maroon + gold from the mosque identity */
:root{
  --bg:#f7f4f1; --surface:#ffffff; --sunk:#f0ebe6; --line:#e5ddd5; --fg:#2b1a17; --muted:#74645d;
  --plum:#7a1e28; --plum-ink:#7a1e28; --plum-soft:#f4e6e3; --gold:#b98d2c; --gold-soft:#f6eedb; --gold-ink:#86660f;
  --band:#6a1820; --band-2:#521219; --band-fg:#fbf3ea; --band-muted:#e3c9bd;
  --ok:#2f7a4f; --ok-soft:#e3f2e8; --warn:#a8630c; --warn-soft:#fbeedb; --bad:#b3261e; --bad-soft:#fbe5e3;
  --logo-main:#6b164b; --logo-gold:#c29a2d;
  --f-display:var(--f-body);
  --f-body:system-ui,-apple-system,BlinkMacSystemFont,"SF Arabic","Segoe UI","Geeza Pro",Tahoma,"Noto Sans Arabic",Roboto,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15100e; --surface:#1f1815; --sunk:#1a1411; --line:#3a2c26; --fg:#f3ebe5; --muted:#b4a198;
  --plum:#8e2a33; --plum-ink:#eba596; --plum-soft:#3a1d1b; --gold:#d6b04f; --gold-soft:#3a2e12; --gold-ink:#e6c46a;
  --band:#4a1117; --band-2:#350b10; --band-fg:#fbf3ea; --band-muted:#d9b9ac;
  --ok:#6cc690; --ok-soft:#183324; --warn:#e8a650; --warn-soft:#3a2810; --bad:#f08a80; --bad-soft:#3d1916;
  --logo-main:#6b164b; --logo-gold:#c29a2d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15100e; --surface:#1f1815; --sunk:#1a1411; --line:#3a2c26; --fg:#f3ebe5; --muted:#b4a198;
  --plum:#8e2a33; --plum-ink:#eba596; --plum-soft:#3a1d1b; --gold:#d6b04f; --gold-soft:#3a2e12; --gold-ink:#e6c46a;
  --band:#4a1117; --band-2:#350b10; --band-fg:#fbf3ea; --band-muted:#d9b9ac;
  --ok:#6cc690; --ok-soft:#183324; --warn:#e8a650; --warn-soft:#3a2810; --bad:#f08a80; --bad-soft:#3d1916;
  --logo-main:#6b164b; --logo-gold:#c29a2d; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-variant-numeric:tabular-nums;font-size:15px;line-height:1.6;direction:rtl}
.lm{fill:var(--logo-main)} .lg{fill:var(--logo-gold)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{min-height:100vh;display:flex;flex-direction:column}
.top{background:var(--band);background-image:radial-gradient(120% 140% at 100% 0%,var(--band) 0%,var(--band-2) 100%);color:var(--band-fg);border-bottom:3px solid var(--gold)}
.top-in{max-width:1180px;margin-inline:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.marks{display:flex;gap:10px;flex:none}
.mark{width:68px;height:68px;border-radius:18px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.22),0 0 0 2px rgba(214,176,79,.55);overflow:hidden}
.mark svg{width:44px;height:auto}
.mark img{height:56px;width:auto}
.titles{flex:1 1 220px;min-width:0}
.titles .t1{font-size:24px;font-weight:800;line-height:1.25}
.titles .t2{font-size:13.5px;color:var(--band-muted)}
.top .meta{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--band-muted);text-align:left}
.top .meta #hijri{color:var(--band-fg);font-weight:700;font-size:13.5px}
.top .status-line{color:var(--band-muted)}
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
nav.tabs{max-width:1180px;margin-inline:auto;display:flex;gap:4px;overflow-x:auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:none}
nav.tabs a{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap;font-size:14.5px}
nav.tabs a svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a:hover{background:var(--sunk);color:var(--fg)}
nav.tabs a[aria-current="page"]{background:var(--plum);color:#fff}
.main{min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-weight:800;font-size:30px;line-height:1.2;margin:0;text-wrap:balance}
.head .lead{color:var(--muted);margin:4px 0 0;max-width:62ch}
.eyebrow{font-size:12px;letter-spacing:.4px;color:var(--gold-ink);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--plum-ink)}
.btn.primary{background:var(--plum);border-color:var(--plum);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold-ink)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-weight:700;font-size:19px;margin:0 0 4px}
.panel .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .lab{font-size:13px;color:var(--muted)}
.kpi .val{font-size:32px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.5px}
.kpi .val small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.kpi .note{font-size:12px;color:var(--muted)}
.kpi.feature{background:var(--plum);border-color:var(--plum);color:#fff}
.kpi.feature .lab,.kpi.feature .note,.kpi.feature .val small{color:#f1d9e7}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--gold);border-radius:99px}
.kpi.feature .bar{background:rgba(255,255,255,.18)}
.stages{display:flex;flex-direction:column;gap:12px}
.stage{display:grid;grid-template-columns:90px minmax(0,1fr) 90px;gap:12px;align-items:center;font-size:14px}
.stage .num{font-variant-numeric:tabular-nums;color:var(--muted);text-align:left;font-size:13px}
.stage .bar{height:12px}
.stage .bar>i{background:var(--plum)}
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--muted);font-size:12.5px;text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
td.n,th.n{font-variant-numeric:tabular-nums;text-align:center}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.plum{background:var(--plum-soft);color:var(--plum-ink)}
.pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:70px}
.count{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .main-t{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--muted)}
.date-chip{font-variant-numeric:tabular-nums;font-size:12px;text-align:center;line-height:1.25;min-width:52px;padding:6px 4px;border-radius:8px;background:var(--gold-soft);color:var(--gold-ink);font-weight:600}
.date-chip b{display:block;font-size:17px;font-weight:800}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.status-line{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--band-muted)}
.dot.live{background:var(--ok)}
.meet{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mcard{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.mcard.next{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.mcard.done{background:var(--sunk)}
.mcard .no{font-size:12px;color:var(--gold-ink);font-weight:700}
.mcard .tp{font-weight:600;line-height:1.4}
.mcard .meta{font-size:12.5px;color:var(--muted)}
.mcard a{color:var(--plum-ink);font-size:13px}
.score-in{width:38px;text-align:center;padding:4px 2px;font-variant-numeric:tabular-nums}
.athar th.grp{text-align:center;color:var(--plum-ink);border-bottom:1px solid var(--plum-soft)}
.athar td,.athar th{padding:6px 4px}
.athar td.name{white-space:nowrap;padding-inline-start:8px}
.sep{border-inline-start:2px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg{max-width:100%;overflow-x:auto}
.seg button{white-space:nowrap;border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--plum);color:#fff}
.modal-back{position:fixed;inset:0;background:rgba(20,8,16,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:min(620px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal h3{margin:0;font-size:20px;font-weight:800}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.form label.full{grid-column:1/-1}
.form label > *{color:var(--fg)}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:60}
.ro .edit-only{display:none!important}
.muted{color:var(--muted)}
.rank{color:var(--gold-ink);font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g32{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .top-in{gap:12px;padding-block:12px}
  .mark{width:52px;height:52px;border-radius:14px}.mark svg{width:34px}.mark img{height:44px}
  .titles .t1{font-size:19px}.titles .t2{font-size:12px}
  .top .meta{display:none}
  nav.tabs a{padding:7px 11px;font-size:14px}
  .g2,.form{grid-template-columns:minmax(0,1fr)}
  .head h1{font-size:25px}
  .stage{grid-template-columns:72px minmax(0,1fr) 70px}
}
@media (max-width:460px){.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.kpi .val{font-size:28px}}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .5s ease}}
/* ---- v3 additions ---- */
.top .who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:4px 10px 4px 4px;border-radius:99px;font-size:12.5px;color:var(--band-fg)}
.top .who img{width:26px;height:26px;border-radius:50%}
.top .who b{font-weight:700}
.preview-bar{background:var(--gold-soft);color:var(--gold-ink);font-size:13.5px;font-weight:600}
.preview-bar .in{max-width:1180px;margin-inline:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dual{display:inline-flex;flex-direction:column;line-height:1.3}
.dual .h{font-weight:700}
.dual .g{font-size:.85em;color:var(--muted)}
.dual.inline{display:inline;flex-direction:row}
.dual.inline .g::before{content:" · "}
/* teacher cards */
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:right;padding:0;font:inherit;color:inherit;transition:transform .15s,box-shadow .15s}
.tcard:hover{box-shadow:0 8px 24px rgba(60,20,20,.12);transform:translateY(-1px)}
.tcard .tc-head{background:var(--band);background-image:linear-gradient(135deg,var(--band) 0%,var(--band-2) 100%);color:var(--band-fg);display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:2px solid var(--gold)}
.tcard .tc-head .em{width:30px;height:30px;border-radius:8px;background:#fff;display:grid;place-items:center;flex:none}
.tcard .tc-head .em svg{width:19px;height:auto}
.tcard .tc-head .lbl{font-size:12px;line-height:1.3;color:var(--band-muted)}
.tcard .tc-head .lbl b{display:block;color:var(--band-fg);font-size:13.5px}
.tcard .tc-head .role{margin-inline-start:auto;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--gold);color:#2b1a17}
.tcard .tc-head .role.asst{background:rgba(255,255,255,.18);color:var(--band-fg)}
.tcard .tc-body{display:flex;gap:14px;padding:14px;align-items:flex-start}
.tcard .av{width:56px;height:56px;border-radius:14px;background:var(--plum-soft);color:var(--plum-ink);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none;border:1.5px solid var(--gold)}
.tcard .nm{font-size:16.5px;font-weight:700;line-height:1.4}
.tcard .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;margin-top:6px}
.tcard .kv dt{color:var(--muted)} .tcard .kv dd{margin:0;font-weight:600}
.tcard .tc-ids{display:grid;grid-template-columns:1fr 1fr;border-top:1px dashed var(--line)}
.tcard .idc{padding:10px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tcard .idc + .idc{border-inline-start:1px dashed var(--line)}
.tcard .idc .t{font-size:11.5px;color:var(--muted);font-weight:600}
.tcard .idc .v{font-size:13.5px;font-weight:700}
.tcard .idc.bad .v{color:var(--bad)} .tcard .idc.warn .v{color:var(--warn)}
.nil{display:block;height:2px;width:70%;background:var(--muted);opacity:.45;border-radius:2px;margin-top:9px}
.tcard .tc-foot{display:flex;gap:8px;flex-wrap:wrap;padding:9px 14px;background:var(--sunk);font-size:12.5px;color:var(--muted)}
.tcard .tc-foot b{color:var(--fg)}
/* attendance */
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daybar .dual{min-width:150px;text-align:center;align-items:center}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.att-list{display:flex;flex-direction:column}
.att{display:grid;grid-template-columns:minmax(0,1.3fr) auto auto;gap:10px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.att .who-s .n{font-weight:700}
.att .who-s .m{font-size:12px;color:var(--muted)}
.st{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.st button{border:0;background:transparent;padding:7px 11px;font-size:13.5px;cursor:pointer;font-weight:600;color:var(--muted)}
.st button + button{border-inline-start:1px solid var(--line)}
.st button[aria-pressed="true"][data-s="حاضر"]{background:var(--ok);color:#fff}
.st button[aria-pressed="true"][data-s="متأخر"]{background:var(--warn);color:#fff}
.st button[aria-pressed="true"][data-s="غائب"]{background:var(--bad);color:#fff}
.st button[aria-pressed="true"][data-s="معتذر"]{background:var(--muted);color:#fff}
.wird{display:flex;gap:6px}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.tog[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
.att .note{grid-column:1/-1}
.att .note input{width:100%;font-size:13.5px}
.saved{font-size:12px;color:var(--ok);font-weight:600}
.reqgrp{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.reqgrp + .reqgrp{margin-top:12px}
.reqgrp .rh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:var(--sunk);font-weight:700}
.pending{max-width:520px;margin:40px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.pending h1{font-size:24px;margin:0}
.pending select{width:100%;font-size:16px;padding:10px}
.roles .li .main-t .t{display:flex;align-items:center;gap:8px}
.roles img{width:30px;height:30px;border-radius:50%}
/* athar */
.segs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg-row:last-child{border-bottom:0}
.seg-row.on{background:var(--ok-soft)}
.seg-row .sn{width:28px;height:28px;border-radius:8px;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;font-weight:800;flex:none}
.seg-row .main-t{flex:1;min-width:160px}
.seg-row .t{font-weight:700}.seg-row .s{font-size:12.5px;color:var(--muted)}
.athar-me{display:grid;grid-template-columns:auto 1fr 1fr;gap:14px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.athar-me .lab{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.steps{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}

.score-in:not(.calc){font-weight:800}
/* prep / attendance */
.pick{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}

.notice{background:var(--gold-soft);border-color:transparent;color:var(--gold-ink);font-size:13.5px}
.daychips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:4px 0 8px;scrollbar-width:thin}
.wk{display:flex;gap:4px;align-items:stretch;padding:4px;border:1px solid var(--line);border-radius:12px;flex:none;position:relative;padding-top:18px}
.wk .wl{position:absolute;top:2px;right:8px;font-size:10.5px;color:var(--muted);font-weight:700}
.dchip{border:1px solid transparent;background:var(--sunk);border-radius:9px;padding:5px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;min-width:56px;position:relative;font:inherit;color:var(--fg)}

.dchip i.part{background:var(--warn)}.dchip i.full{background:var(--ok)}
.dchip.on{background:var(--plum);color:#fff}.dchip.on span{color:#f1d9e7}
.dchip.future{opacity:.45}.dchip.act b{color:var(--gold-ink)}.dchip.on.act b{color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.tile-main{border:0;background:transparent;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:inherit;color:inherit;text-align:center;min-height:96px;justify-content:center;position:relative}
.tile .tn{position:absolute;top:6px;right:8px;font-size:11px;color:var(--muted);font-weight:700}
.tile .tname{font-weight:700;line-height:1.35;font-size:14.5px}

.tile.ok{border-color:var(--ok)}.tile.ok .tst{background:var(--ok);color:#fff}
.tile.warn{border-color:var(--warn)}.tile.warn .tst{background:var(--warn);color:#fff}
.tile.bad{border-color:var(--bad)}.tile.bad .tst{background:var(--bad);color:#fff}
.tile.exc .tst{background:var(--muted);color:#fff}
.tts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.tts button{border:0;background:transparent;padding:7px 0;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
.tts button + button{border-inline-start:1px solid var(--line)}
.tts button[aria-pressed="true"]{background:var(--plum);color:#fff}
.st.ts button[aria-pressed="true"]{background:var(--plum);color:#fff}
table.month td,table.month th{padding:5px 3px;text-align:center}

.mc{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:11px;font-weight:800;background:var(--sunk);color:var(--muted)}

.mt{display:block;font-size:10px;color:var(--plum-ink);font-weight:700}
/* meetings */
.cdrow{display:flex;gap:10px;margin-top:10px}

.btn svg,.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-inline-end:6px}

a.iconbtn{color:var(--plum-ink);text-decoration:none}
.li.past{opacity:.6}
.steps-list{margin:6px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;line-height:1.7}

/* responsive tables -> cards */

  table.rsp td:empty{display:none}
  .tablewrap{margin-inline:0}
  .att{grid-template-columns:minmax(0,1fr)}
  .st{width:100%}.st button{flex:1;padding:9px 4px}

  .navbar{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  body::before{display:none}
  nav.tabs{padding-block:4px calc(4px + env(safe-area-inset-bottom,0px));gap:0;justify-content:space-around;overflow:visible}
  nav.tabs a{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:11px;border-radius:10px;text-align:center;min-width:0}
  nav.tabs a span.lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  nav.tabs a svg{width:22px;height:22px}
  nav.tabs a[aria-current="page"]{background:transparent;color:var(--plum-ink)}
  nav.tabs a[aria-current="page"] svg{stroke-width:2.3}
  .main{padding-block:18px calc(90px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .top .who{display:none!important}
  .tcards{grid-template-columns:minmax(0,1fr)}
  .athar-me{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pick select{min-width:0;width:100%}.pick{flex:1 1 100%}
  .cd{min-width:0;flex:1}
  nav.tabs a{font-size:10.5px}
  .steps{display:flex}.steps button{flex:1}
}

.contact .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

.av{display:grid;place-items:center;flex:none;background:var(--plum-soft);color:var(--plum-ink);font-weight:800;border:1.5px solid var(--gold);border-radius:14px;width:44px;height:44px;font-size:18px;overflow:hidden}
.av.sm{width:34px;height:34px;font-size:14px;border-radius:10px}
.photo-edit .av,.claim-photo .av{border-radius:20px}
.hbtn.bell{position:relative;padding:6px 8px}
.hbtn .nb{position:absolute;top:-6px;left:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#e0a62a;color:#2b1a17;font:700 11px/18px system-ui;font-style:normal;text-align:center}
.npush{display:grid;gap:6px;padding:12px;border-radius:12px;background:var(--sunk);margin-bottom:12px}
.npush .btn{justify-self:start}
.nitem{text-decoration:none;color:inherit}
.nitem.new .t::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-inline-start:6px;vertical-align:middle}
.nic{font-size:22px;width:36px;text-align:center}
.qinv .list{max-height:420px;overflow:auto}
.qinv .av.sm img{width:100%;height:100%;object-fit:cover}

.modesw[hidden],[hidden].hbtn{display:none!important}
.kpi.feature .val small{display:block;margin-top:2px}
@media (max-width:640px){
  .acc .main-t{flex:1 1 calc(100% - 50px);min-width:0}
  .acc select{flex:1 1 40%;max-width:none}
  .acc .btn{flex:0 0 auto}
}
@media (max-width:640px){
  .top-in{padding-block:10px;gap:8px 10px}
  .mark{width:46px;height:46px;border-radius:13px}.mark svg{width:30px}.mark img{height:38px}
  .titles{flex:1 1 150px}.titles .t1{font-size:18px}.titles .t2{font-size:11.5px;line-height:1.5}
  .top .meta{display:flex!important;order:3;width:auto;flex:1 1 auto;align-items:center}
  .top .meta #hijri{display:block!important;font-size:12px;font-weight:600}
  .top .meta #hijri div{display:none}
  #installbtn,.top .who{order:4}
  table.mini thead{display:none}
  table.mini,table.mini tbody{display:block}
  table.mini tr{display:flex!important;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 2px!important;border-bottom:1px solid var(--line);margin:0!important;border-radius:0!important;box-shadow:none!important;background:none!important}
  table.mini td{display:inline-flex!important;align-items:center;gap:5px;padding:0!important;border:0!important;font-size:13px;width:auto!important}
  table.mini td.primary{flex-basis:100%;font-size:15px}
  table.mini td[data-label]::before{content:attr(data-label);color:var(--muted);font-weight:400;position:static!important;width:auto!important}
}

@media (max-width:640px){ #installbtn span{display:none} .top .who{display:flex!important;padding:2px 4px;background:transparent;border:0} .top .who span{display:none} }
.top .who[hidden],#installbtn[hidden]{display:none!important}
